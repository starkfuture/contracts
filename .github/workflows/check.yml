# Every PR and every push to main: the pinned upstream files are unchanged and every patch applies with
# no fuzz to the pinned upstream tag, and the Dockerfile builds on the base digest named in UPSTREAM.
# No cloud credentials. The permission matrix needs a running DocuSeal: tests/run_pod_tests.sh.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pins hold and patches apply to the pinned upstream tag
        run: python3 tools/assemble.py
      - name: Dockerfile base matches UPSTREAM
        run: grep -qx "FROM $(sed -n 's/^MIRROR=//p' UPSTREAM)" Dockerfile
