# Builds the Stark DocuSeal image (amd64 + arm64: the cluster has both) and pushes it to ECR as
# docuseal:<upstream tag>-stark-<short sha>. Manual or on main. Deploying it is an argo-cd change.
# Needs the IAM role below, trusted for this repository only (stark-terraform).
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: eu-west-1
  ROLE: arn:aws:iam::952414816681:role/GithubActionsDocusealStark
  REPO: 952414816681.dkr.ecr.eu-west-1.amazonaws.com/docuseal
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble build/app (patches must apply)
        run: python3 tools/assemble.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          TAG="$(sed -n 's/^TAG=//p' UPSTREAM)-stark-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$REPO:$TAG" --push .
          echo "pushed $REPO:$TAG" >> "$GITHUB_STEP_SUMMARY"
