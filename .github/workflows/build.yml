# Builds the Stark DocuSeal image for amd64 and arm64 (the cluster has both; the build is a plain COPY
# onto the multi-arch upstream index, so no emulation) and pushes docuseal-stark:<tag>-stark-<sha7>.
# Only from main. Deploying an image is an argo-cd change.
# Needs, from stark-terraform: ECR repository docuseal-stark (immutable tags) and IAM role
# GithubActionsDocusealStark trusted for this repository's main branch only.
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: eu-west-1
  ROLE: arn:aws:iam::952414816681:role/GithubActionsDocusealStark
  REPO: 952414816681.dkr.ecr.eu-west-1.amazonaws.com/docuseal-stark
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pins hold and patches apply (same gate as check.yml)
        run: |
          python3 tools/assemble.py
          grep -qx "FROM $(sed -n 's/^MIRROR=//p' UPSTREAM)" Dockerfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          TAG="$(sed -n 's/^TAG=//p' UPSTREAM)-stark-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$REPO:$TAG" --push .
          echo "pushed $REPO:$TAG" >> "$GITHUB_STEP_SUMMARY"
